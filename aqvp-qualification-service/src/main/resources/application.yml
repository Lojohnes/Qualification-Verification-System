spring:
  application:
    name: qualification-service
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${PORT:8082}

aqvp:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-very-long-secret-key-at-least-256-bits}
  documents:
    storage-root: ${DOCUMENT_STORAGE_ROOT:data/documents}
    signing-secret: ${DOCUMENT_SIGNING_SECRET:change-me-document-signing-secret-at-least-256-bits}
    signer-key-id: ${DOCUMENT_SIGNER_KEY_ID:local-dev-key}
