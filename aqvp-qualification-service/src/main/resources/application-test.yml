spring:
  datasource:
    url: jdbc:h2:mem:qualification_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  sql:
    init:
      mode: never

server:
  port: 0
