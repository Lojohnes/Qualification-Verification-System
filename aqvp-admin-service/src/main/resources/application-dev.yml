aqvp:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-very-long-secret-key-at-least-256-bits}
  notifications:
    mock: ${NOTIFICATIONS_MOCK:true}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

spring:
  datasource:
    url: ${ADMIN_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/aqvp_db}}
    username: ${ADMIN_DB_USERNAME:${DATABASE_USERNAME:aqvp}}
    password: ${ADMIN_DB_PASSWORD:${DATABASE_PASSWORD:aqvp}}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

server:
  port: 8084
