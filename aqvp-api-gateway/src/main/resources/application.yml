spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_ORIGIN:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - '*'
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
        - id: qualification-service
          uri: ${QUALIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/qualifications/**
          filters:
            - StripPrefix=1
        - id: verification-service
          uri: ${VERIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/verification/**
          filters:
            - StripPrefix=1
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1

server:
  port: ${PORT:8080}
