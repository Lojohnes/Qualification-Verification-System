spring:
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
        - id: qualification-service
          uri: http://localhost:8082
          predicates:
            - Path=/qualifications/**
          filters:
            - StripPrefix=1
        - id: verification-service
          uri: http://localhost:8083
          predicates:
            - Path=/verification/**
          filters:
            - StripPrefix=1
        - id: admin-service
          uri: http://localhost:8084
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1

server:
  port: 8080
